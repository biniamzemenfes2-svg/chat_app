{% extends 'base.html' %} {% block content %}
<div
  class="message-box"
  style="
    max-width: 600px;
    margin: 50px auto;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    background: #fff;
  "
>
  <h2>Chat Room: {{ code }}</h2>

  <div
    class="messages"
    id="messages"
    style="
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 10px;
    "
  ></div>

  <div class="input" style="display: flex; gap: 10px">
    <input
      type="text"
      placeholder="Type your message..."
      name="message"
      id="message"
      style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #ccc"
    />
    <button
      type="button"
      name="send"
      id="send-btn"
      onclick="sendMessage()"
      style="
        padding: 8px 12px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      "
    >
      Send
    </button>
  </div>
</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<script type="text/javascript">
  var socketio = io();

  const messages = document.getElementById("messages");

  const createMessage = (name, msg) => {
    const content = `
            <div class="text" style="margin-bottom:8px;">
                <span><strong>${name}</strong>: ${msg}</span><br>
                <span class="muted" style="font-size:0.8em;color:gray;">
                    ${new Date().toLocaleTimeString()}
                </span>
            </div>
        `;
    messages.innerHTML += content;
    messages.scrollTop = messages.scrollHeight;
  };

  socketio.on("message", (data) => {
    createMessage(data.name, data.message);
  });

  const sendMessage = () => {
    const messageInput = document.getElementById("message");
    if (messageInput.value.trim() === "") return;
    socketio.emit("message", { data: messageInput.value });
    messageInput.value = "";
  };
</script>

{% for msg in messages %}
<script type="text/javascript">
  createMessage("{{ msg.name | escape }}", "{{ msg.message | escape }}");
</script>
{% endfor %} {% endblock %}
